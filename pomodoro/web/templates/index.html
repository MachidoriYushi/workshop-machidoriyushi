<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body>
    <main class="app-shell" data-role="app-shell">
      <section class="timer-card" aria-labelledby="app-title">
        <header class="timer-header">
          <h1 id="app-title">ポモドーロタイマー</h1>
          <div class="window-controls" aria-hidden="true">
            <span>-</span>
            <span>□</span>
            <span>×</span>
          </div>
        </header>

        <p class="status-label" data-role="status-label">作業中</p>

        <div class="progress-ring" data-role="progress-ring" aria-label="タイマーの進捗">
          <div class="timer-display" data-role="timer-display">25:00</div>
        </div>

        <div class="timer-actions">
          <button type="button" class="primary-button" data-role="start-button">開始</button>
          <button type="button" class="secondary-button" data-role="reset-button">リセット</button>
        </div>

        <section class="notification-panel" aria-label="通知設定">
          <button type="button" class="text-button" data-role="notification-button">通知を有効化</button>
          <label class="sound-toggle">
            <input type="checkbox" data-role="sound-toggle" checked>
            <span>サウンド</span>
          </label>
          <p data-role="notification-message" aria-live="polite"></p>
        </section>

        <section class="stats-panel" aria-labelledby="today-progress-title">
          <h2 id="today-progress-title">今日の進捗</h2>
          <dl class="stats-list">
            <div>
              <dt data-role="today-completed-count">4</dt>
              <dd>完了</dd>
            </div>
            <div>
              <dt data-role="today-focus-time">1時間40分</dt>
              <dd>集中時間</dd>
            </div>
          </dl>
        </section>
      </section>
    </main>
    <script src="/static/js/timer.js"></script>
  </body>
</html>
